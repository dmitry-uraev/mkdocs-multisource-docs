name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry and virtual environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock', '**/pyproject.toml') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Poetry
        run: |
          pipx install poetry==2.4.0
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --with quality,dev --no-interaction --no-ansi

      - name: Run quality checks
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
          poetry run pytest --cov=mkdocs_multisource_docs --cov-report=xml --cov-report=term-missing
